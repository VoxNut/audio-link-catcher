<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Audio Link Catcher</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <header>
      <div>
        <h1>Audio Link Catcher</h1>
        <p id="page-name">Checking this tab…</p>
      </div>
      <button id="clear" type="button" title="Clear detected links">Clear</button>
    </header>
    <main>
      <div class="search-row">
        <label class="sr-only" for="search">Search detected audio</label>
        <input id="search" type="search" placeholder="Search audio / 音声を検索" autocomplete="off" spellcheck="false">
      </div>
      <p id="status" role="status"></p>
      <div id="items" aria-live="polite"></div>
      <template id="item-template">
        <article class="item">
          <div class="copy">
            <p class="filename"></p>
            <p class="metadata"></p>
            <p class="url"></p>
          </div>
          <button class="download" type="button">Download</button>
        </article>
      </template>
    </main>
    <footer>Links appear as the page loads or plays. Filenames keep Unicode characters.</footer>
    <script src="popup.js"></script>
  </body>
</html>
